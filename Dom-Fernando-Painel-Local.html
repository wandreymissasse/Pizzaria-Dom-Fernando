function cashBalance(){const cash=unit().cash;return cash.initial+orders().flatMap(o=>o.payments).filter(p=>p.method==='Dinheiro'&&p.at>=cash.opened).reduce((s,p)=>s+p.amount,0)+cash.movements.reduce((s,m)=>s+m.amount,0);}
function cashView(){const os=orders().filter(o=>o.status==='aberta'),cash=unit().cash,ps=orders().flatMap(o=>o.payments.map(p=>({...p,number:o.number,order:o})));return title('Caixa e financeiro','Recebimentos, fechamento de comandas e despesas manuais.',btn(cash.open?'Fechar caixa':'Abrir caixa','cash-toggle','','primary'))+`<div class="stats">${stat('Caixa',cash.open?'Aberto':'Fechado','Operador demonstrativo')}${stat('Dinheiro previsto',money(cashBalance()),'Fundo inicial + dinheiro + movimentos do turno')}${stat('Recebimentos do cenário',money(ps.reduce((s,p)=>s+p.amount,0)),'Dinheiro, Pix e cartão registrados')}${stat('A receber',money(os.reduce((s,o)=>s+remaining(o),0)),'Comandas abertas')}</div><div class="grid-even"><section class="panel"><div class="panel-head"><h2>Comandas para receber</h2>${badge(os.length)}</div>${os.map(o=>`<div class="row"><div><b>${locationLabel(o)}</b><small>#${o.number} • total ${money(D.total(o))}</small></div>${btn(money(remaining(o))+' →','payment',o.id)}</div>`).join('')||'<div class="empty">Nenhuma comanda aberta.</div>'}</section><section class="panel"><div class="panel-head"><h2>Movimentos e despesas</h2><div class="actions">${btn('Sangria / suprimento','cash-move')}${btn('+ Despesa','expense-new')}</div></div>${cash.movements.map(m=>`<div class="row"><div><b>${esc(m.reason)}</b><small>Movimento do caixa</small></div><b>${money(m.amount)}</b></div>`).join('')}${state.expenses.filter(e=>e.branch===branch).map(e=>`<div class="row"><div><b>${esc(e.name)}</b><small>Vence ${esc(e.date)} • ${e.paid?'paga':'pendente'}</small></div><div>${money(e.amount)} ${!e.paid?btn('Pagar','expense-pay',e.id):''}</div></div>`).join('')||'<p class="sub">Cadastre despesas para acompanhar os vencimentos.</p>'}</section></div><section class="panel table-scroll"><h2>Recebimentos registrados</h2><table><thead><tr><th>Comanda / mesa</th><th>Primeiro pedido</th><th>Solicitou fechamento</th><th>Permanência</th><th>Recebimento</th><th>Meio</th><th>Valor</t function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function selectField(label,name,options,value){return `<label>${label}<select name="${name}">${options.map(([id,label])=>`<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(label)}</option>`).join('')}</select></label>`;}

function updateOrderFields(){const form=$('#new-order-form');if(!form)return;const type=form.querySelector('[name=type]').value;for(const name of ['table','people','origin','customer','phone','address','fee','external']){const el=form.querySelector('[name="'+name+'"]'),visible=['table','people','origin'].includes(name)?type==='mesa':['address','fee'].includes(name)?type==='delivery':type!=='mesa';el.closest('label').hidden=!visible;el.disabled=!visible;if(['customer','phone','address'].includes(name))el.required=type==='delivery';}$('#service-notice').hidden=type!=='mesa';$('#draft-total-label').textContent=type==='mesa'?'Total com taxa de garçom':'Total do pedido';drawDraft();}

function openItem(){if($('#new-order-form'))orderFormCache=new FormData($('#new-order-form'));const flavors=state.products.filter(p=>p.kind==='pizza'&&p.available);modal('Adicionar item',`<form id="item-form"><div class="form-grid">${selectField('Categoria','category',[['pizza','Pizza'],['bebida','Bebida']],'pizza')}${field('Quantidade','qty',1,'number','min="1" max="99" required')}</div><div id="item-builder"></div><label class="field">Observações<textarea name="notes" placeholder="Sem cebola, bem assada…"></textarea></label></form>`,btn('Voltar ao pedido','back-draft')+btn('Adicionar ao pedido','save-item','','primary'));buildItem();}

function buildParts(){const size=$('[name=size]').value,ps=state.products.filter(p=>p.kind==='pizza'&&p.available),single=$('[name=single-flavor]').checked,previous=[...document.querySelectorAll('#flavor-parts input:checked')].map(el=>el.value),count=single?1:D.sizes[size].parts;$('#flavor-parts').innerHTML=Array.from({length:count},(_,i)=>{const selected=previous[i]||previous[0]||ps[0]?.id;return `<fieldset class="flavor-group"><legend>${single?'Sabor da pizza inteira':'Parte '+(i+1)+' de '+D.sizes[size].parts}</legend><div class="flavor-options">${ps.map(p=>`<label class="flavor-option"><input type="radio" name="flavor-${i}" value="${p.id}" ${selected===p.id?'checked':''} required><span>${esc(p.name)}${p.surcharge?` <small>+${money(p.surcharge)}</small>`:''}</span></label>`).join('')}</div></fieldset>`;}).join('');previewPizza();}

function itemData(){const f=new FormData($('#item-form')),qty=Number(f.get('qty'));if(!Number.isInteger(qty)||qty<1||qty>99)throw Error('Quantidade deve ser de 1 a 99.');if(f.get('category')==='bebida'){const p=product(f.get('drink'));if(!p)throw Error('Cadastre uma bebida disponível.');if(f.has('drink-ice')&&f.has('drink-lemon'))throw Error('Selecione apenas uma opção de copo.');return {id:uid(),product:p.id,name:p.name,description:f.has('drink-lemon')?'Copo com gelo e limão':f.has('drink-ice')?'Copo com gelo':'',price:p.price,qty,sector:'bar',notes:f.get('notes'),status:'aguardando',cancelled:false};}const size=f.get('size'),selected=f.has('flavor-0')?Array.from({length:f.has('single-flavor')?1:D.sizes[size].parts},(_,i)=>f.get('flavor-'+i)):f.getAll('flavor'),flavors=f.has('single-flavor')?Array(D.sizes[size].parts).fill(selected[0]):selected,borders=f.getAll('border').filter(Boolean),extras=[...new Set(f.getAll('extra'))].map(id=>({id,qty:1}));return {id:uid(),product:flavors[0],name:'Pizza '+size,description:D.compose(flavors,state.products)+(borders.length?' • '+borders.map(id=>product(id).name).join(' + '):'')+(extras.length?' • Adicionais inclusos: '+extras.map(e=>product(e.id)?.name||e.id).join(', '):''),price:D.pizzaPrice(size,flavors,borders,extras,state.products,state.pizzaPrices),qty,sector:'cozinha',notes:f.get('notes'),status:'aguardando',cancelled:false};}

function drawDraft(){if(!$('#draft-list'))return;$('#draft-list').className='';$('#draft-list').innerHTML=draft.map((i,index)=>`<div class="cart-item"><div><b>${i.qty}× ${esc(i.name)}</b><small>${esc(i.description)}</small><small>${esc(i.notes)}</small></div><div>${money(i.price*i.qty)} ${btn('Remover','draft-remove',index,'quiet')}</div></div>`).join('')||'<div class="empty">Adicione itens ao pedido.</div>';const type=$('#new-order-form [name=type]').value,fee=type==='delivery'?D.cents($('#new-order-form [name=fee]').value||0):0;$('#draft-total').textContent=money(D.total({type,items:draft,fee}));}

eived:0,date:f.get('date'),reason:f.get('reason'),requester:'Gerência demonstrativa',created:Date.now(),status:'pendente',receipts:[]});audit('Compra solicitada',`${product(f.get('product')).name} • ${qty}`);closeModal();save('Solicitação criada sem alterar estoque.');return;}if(a==='auto-purchases'){let n=0;state.products.filter(p=>['bebida','insumo'].includes(p.kind)).forEach(p=>{const stock=unit().stock[p.id]||0,min=unit().minimum[p.id]||0;if(stock<min&&!state.purchases.some(r=>r.branch===branch&&r.product===p.id&&!['cancelada','recebida'].includes(r.status))){state.purchases.push({id:uid(),branch,product:p.id,qty:min-stock,received:0,status:'pendente',reason:'Estoque abaixo do mínimo',requester:'Automático • mínimo',created:Date.now(),date:'',receipts:[]});n++;}});audit('Solicitações automáticas',`${n} criada(s)`);save(`${n} solicitação(ões) criada(s), sem duplicar abertas.`);return;}if(['purchase-approve','purchase-bought','purchase-cancel'].includes(a)){const p=state.purchases.find(p=>p.id===id);p.status=({'purchase-approve':'aprovada','purchase-bought':'compra realizada','purchase-cancel':'cancelada'})[a];audit('Compra atualizada',`${product(p.product).name} • ${p.status}`);save('Compra atualizada.');return;}if(a==='purchase-receive'){receivePurchase(id);return;}if(a==='receive-save'){const p=state.purchases.find(p=>p.id===id),f=validForm('#receive-form'),qty=+f.get('qty'),conversion=+f.get('conversion'),note=f.get('note').trim();if(f.get('branch')!==branch)throw Error('Filial destinatária divergente.');if(!Number.isInteger(qty)||qty<1||!Number.isInteger(conversion)||conversion<1)throw Error('Quantidade ou conversão inválida.');if(state.purchases.some(x=>(x.receipts||[]).some(r=>r.note===note)))throw Error('Nota já recebida. Use outro identificador para o próximo recebimento parcial.');const units=qty*conversion;if(units>p.qty-(p.received||0))throw Error('Quantidade excede o saldo solicitado.');p.receipts??=[];p.receipts.push({note,qty,conversion,units,at:Date.now(),branch,reason:f.get('reason')});p.received=(p.received||0)+units;p.status=p.received===p.qty?'recebida':'parcial';unit().stock[p.product]=(unit().stock[p.product]||0)+units;audit('Compra recebida',`${note} • ${qty} × ${conversion} = ${units} • ${product(p.product).name}`);closeModal();save('Recebimento confirmado e estoque atualizado.');return;}
 if(a==='operation-settings'){operationSettings();return;}if(a==='settings-save'){const f=validForm('#settings-form');unit().settings={deadline:+f.get('deadline'),opens:f.get('opens'),closes:f.get('closes')};closeModal();save('Configuração local salva.');return;}
 if(a==='cash-toggle'){const c=unit().cash;if(c.open)modal('Fechar caixa',`<form id="cash-form"><p>Dinheiro previsto: <b>${money(cashBalance())}</b></p>${field('Dinheiro contado (R$)','amount',cashBalance()/100,'number','min="0" step="0.01" required')}${field('Justificativa de diferença (se houver)','reason')}</form>`,btn('Voltar','close')+btn('Confirmar fechamento','cash-save','close','primary'));else modal('Abrir caixa',`<form id="cash-form">${field('Fundo inicial (R$)','amount',200,'number','min="0" step="0.01" required')}</form>`,btn('Voltar','close')+btn('Abrir','cash-save','open','primary'));return;}if(a==='cash-save'){const f=validForm('#cash-form'),amount=D.cents(f.get('amount'));if(amount<0||!Number.isFinite(amount))throw Error('Valor inválido.');const c=unit().cash;if(id==='close'){const diff=amount-cashBalance();if(diff!==0&&!f.get('reason').trim())throw Error('Explique a diferença de caixa.');c.open=false;audit('Caixa fechado',`Contado ${money(amount)} • diferença ${money(diff)} • ${f.get('reason')}`);}else{c.open=true;c.initial=amount;c.movements=[];c.opened=Date.now();audit('Caixa aberto',money(amount));}closeModal();save('Caixa atualizado.');return;}if(a==='cash-move'){if(!unit().cash.open)throw Error('Abra o caixa antes de registrar sangria ou suprimento.');modal('Sangria ou suprimento',`<form id="cash-move-form"><div class="summary-box"><span>Dinheiro disponível para sangria</span><h2>${money(Math.max(0,cashBalance()))}</h2><p class="sub">Somente dinheiro físico do caixa. Pix e cartão não entram nesse limite.</p></div><div class="form-grid">${selectField('Tipo','type',[['out','Sangria'],['in','Suprimento']],'out')}${field('Valor (R$)','amount',Math.max(0,cashBalance())/100,'number','min="0.01" step="0.01" required')}<label class="wide">Motivo<input name="reason" required></label></div><p id="cash-move-preview" class="sub"></p><p class="sub">Permissão apenas demonstrativa nesta etapa.</p></form>`,btn('Voltar','close')+btn('Registrar','cash-move-save','','primary'));updateCashMove();return;}if(a==='cash-move-save'){if(!unit().cash.open)throw Error('Caixa fechado.');const f=validForm('#cash-move-form'),amount=D.cents(f.get('amount'))*(f.get('type')==='out'?-1:1);if(!['out','in'].includes(f.get('type'))||!Number.isInteger(amount)||amount===0||(f.get('type')==='out'?amount>=0:amount<=0))throw Error('Informe um valor positivo válido.');if(amount<0&&cashBalance()+amount<0)throw Error('Sangria acima do disponível. Você pode retirar até '+money(Math.max(0,cashBalance()))+'.');unit().cash.movements.push({at:Date.now(),amount,reason:f.get('reason')});audit('Movimento de caixa',`${money(amount)} • ${f.get('reason')}`);closeModal();save('Movimento registrado.');return;}
 if(a==='expense-new'){modal('Despesa manual',`<form id="expense-form"><div class="form-grid">${field('Descrição','name','','text','required')}${field('Valor (R$)','amount','','number','min="0.01" step="0.01" required')}${field('Vencimento','date','','date','required')}</div></form>`,btn('Voltar','close')+btn('Salvar','expense-save','','primary'));return;}if(a==='expense-save'){const f=validForm('#expense-form');state.expenses.push({id:uid(),branch,name:f.get('name'),amount:D.cents(f.get('amount')),date:f.get('date'),paid:false});closeModal();save('Despesa registrada.');return;}if(a==='expense-pay'){modal('Pagamento de despesa',`<p>Registrar pagamento demonstrativo? Este registro não movimenta o caixa físico automaticamente.</p>`,btn('Voltar','close')+btn('Confirmar pagamento','expense-paid',id,'primary'));return;}if(a==='expense-paid'){const e=state.expenses.find(e=>e.id===id);e.paid=true;audit('Despesa paga',`${e.name} • ${money(e.amount)}`);closeModal();save('Despesa marcada como paga.');return;}
}
function refundModal(id){const o=state.orders.find(o=>o.id===id),payments=o.payments.filter(p=>p.amount>0&&p.amount>(p.refunded||0));modal('Estorno • gerência demonstrativa',`<form id="refund-form"><div class="notice">Autorização simulada de gerência. O registro não devolve dinheiro por integração bancária.</div><div class="form-grid">${selectField('Pagamento de origem','payment',payments.map(p=>[p.id,p.method+' • disponível '+money(p.amount-(p.refunded||0))]))}${field('Valor a estornar (R$)','amount','','number','min="0.01" step="0.01" required')}<label class="wide">Motivo<input name="reason" required></label></div><p class="sub">O saldo será reaberto. Bebidas e ingredientes não retornam automaticamente ao estoque.</p></form>`,btn('Voltar','order-detail',id)+btn('Autorizar estorno simulado','refund-save',id,'danger'));}
function refundSave(id){const o=state.orders.find(o=>o.id===id),f=validForm('#refund-form'),p=o.payments.find(p=>p.id===f.get('payment')),amount=D.cents(f.get('amount'));if(!p||!Number.isFinite(amount)||amount<=0||amount>p.amount-(p.refunded||0))throw Error('Valor maior que o disponível no pagamento.');if(p.method==='Dinheiro'&&!unit().cash.open)throw Error('Abra o caixa antes de estornar dinheiro.');if(o.status==='fechada'&&o.tables.some(t=>{const other=tableOrder(t);return other&&other.id!==o.id;}))throw Error('A mesa já está ocupada por outra comanda. Resolva a ocupação antes de reabrir.');p.refunded=(p.refunded||0)+amount;o.payments.push({id:uid(),method:p.method,amount:-amount,at:Date.now(),origin:p.id,reason:f.get('reason')});if(o.status==='fechada')o.status='aberta';audit('Estorno autorizado • simulação',`#${o.number} • ${money(amount)} • ${f.get('reason')}`);save('Estorno registrado e saldo atualizado.');orderDetail(id);}
render();setInterval(()=>{if(page==='production'&&!$('#modal').open)render();},30000);

function pizzaPricesModal(){modal('Preços padrão por tamanho',`<form id="pizza-prices-form"><p class="sub">Um valor por tamanho, independente do sabor. Sabores especiais somam o maior acréscimo selecionado. Bordas e adicionais são cobrados separadamente.</p><div class="form-grid" style="margin-top:16px">${Object.keys(D.sizes).map(k=>field(k+' (R$)',k,state.pizzaPrices[k]/100,'number','min="0.01" step="0.01" required')).join('')}</div></form>`,btn('Voltar','close')+btn('Salvar preços','pizza-prices-save','','primary'));}
function updateProductFields(){const form=$('#product-form');if(!form?.querySelector)return;const kind=form.querySelector('[name=kind]').value;for(const name of ['surcharge','price','weight','negative',...Object.keys(D.sizes).map(k=>'size-'+k)]){const el=form.querySelector('[name="'+name+'"]');const visible=name==='surcharge'?kind==='pizza':name==='price'?kind==='bebida':name.startsWith('size-')?['borda','adicional'].includes(kind):['bebida','insumo'].includes(kind);el.closest('label').hidden=!visible;el.disabled=!visible;}const heading=[...form.querySelectorAll('h3')].find(h=>h.textContent.includes('Preços por tamanho'));if(heading)heading.parentElement.hidden=!['borda','adicional'].includes(kind);}

function normalizeSearch(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function matchesRegister(r){const text=normalizeSearch([r.name,r.phone,r.cpf,r.address,r.role,r.kind,r.unit].join(' '));const query=normalizeSearch(registerSearch).trim();if(query&&!query.split(/\s+/).every(word=>text.includes(word)))return false;if(registerKind&&(r.kind||r.role)!==registerKind)return false;if(registerAvailability&&String(r.available)!==registerAvailability)return false;return true;}
function registerFilterBar(){const arr=state[{products:'products',customers:'customers',suppliers:'suppliers',users:'users'}[registerTab]],placeholder=registerTab==='products'?'Pesquisar produto, tipo ou embalagem…':registerTab==='customers'?'Pesquisar nome, telefone, CPF ou endereço…':registerTab==='suppliers'?'Pesquisar fornecedor ou telefone…':'Pesquisar nome ou perfil…';const kinds=registerTab==='products'?['pizza','bebida','insumo','borda','adicional']:registerTab==='users'?['Dono','Gerência','Compras/estoque','Caixa','Garçom','Cozinha','Bar','Balcão']:[];return `<div class="toolbar"><input id="register-search" type="search" aria-label="Pesquisar cadastros" placeholder="${placeholder}" value="${esc(registerSearch)}">${kinds.length?`<select id="register-kind" aria-label="Filtrar por tipo ou perfil"><option value="">${registerTab==='products'?'Todos os tipos':'Todos os perfis'}</option>${kinds.map(k=>`<option value="${esc(k)}" ${registerKind===k?'selected':''}>${esc(k)}</option>`).join('')}</select>`:''}${registerTab==='products'?`<select id="register-availability" aria-label="Filtrar por disponibilidade"><option value="">Todas as disponibilidades</option><option value="true" ${registerAvailability==='true'?'selected':''}>Disponíveis</option><option value="false" ${registerAvailability==='false'?'selected':''}>Indisponíveis</option></select>`:''}${btn('Limpar filtros','register-clear')}<span class="sub">${arr.filter(matchesRegister).length} de ${arr.length} cadastro(s)</span></div>`;}

function requestView(){const list=state.purchases.filter(p=>p.branch===branch&&!p.direct);return title('Solicitações de compra','Gerência informa a necessidade; o time de compras recebe e acompanha.',btn('+ Solicitar compra','purchase-new','','primary'))+`<div class="notice">Solicitar não altera estoque nem exige setor ou fornecedor. O fornecedor será definido por compras conforme as cotações.</div><section class="panel table-scroll"><table><thead><tr><th>Produto</th><th>Quantidade</th><th>Solicitante / justificativa</th><th>Data necessária</th><th>Situação</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(product(p.product)?.name)}</b></td><td>${p.qty} ${esc(product(p.product)?.unit)}</td><td>${esc(p.requester||'Gerência demonstrativa')}<small>${esc(p.reason)}</small></td><td>${esc(p.date||'A definir')}</td><td>${badge(p.status,p.status==='recebida'?'green':'orange')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma solicitação nesta filial.</td></tr>'}</tbody></table></section>`;}
function buyerInbox(){const pending=state.purchases.filter(p=>p.status==='pendente'&&!p.direct);return `<section class="panel"><div class="panel-head"><h2>Solicitações recebidas • três filiais</h2>${badge(pending.length+' pendentes','orange')}</div><p class="sub">Caixa de entrada demonstrativa do responsável por compras.</p>${pending.map(p=>`<div class="row"><div><b>${esc(product(p.product)?.name)} • ${p.qty} ${esc(product(p.product)?.unit)}</b><small>${esc(state.branches.find(b=>b.id===p.branch).name)} • ${esc(p.requester||'Gerência demonstrativa')} • ${esc(p.date||'Data a definir')}</small><small>${esc(p.reason)}</small></div>${btn('Analisar solicitação','request-open',p.id)}</div>`).join('')||'<div class="empty">Nenhuma solicitação aguardando atendimento.</div>'}</section>`;}
function purchaseSupplierModal(id){modal('Registrar compra • após cotação',`<form id="supplier-form"><div class="form-grid">${selectField('Fornecedor escolhido por compras','supplier',state.suppliers.map(p=>[p.name,p.name]))}<label class="wide">Referência da cotação / observação<input name="quotation" placeholder="Condição negociada ou referência da cotação"></label></div><p class="sub">Esta confirmação não movimenta estoque. A entrada acontece no recebimento.</p></form>`,btn('Voltar','close')+btn('Confirmar compra','buy-confirm',id,'primary'));}
function entryNew(){modal('Entrada de mercadoria sem solicitação',`<form id="entry-form"><div class="form-grid">${selectField('Produto','product',state.products.filter(p=>['bebida','insumo'].includes(p.kind)).map(p=>[p.id,p.name]))}${field('Quantidade na unidade do estoque','qty',1,'number','min="1" step="1" required')}${selectField('Fornecedor da compra','supplier',state.suppliers.map(p=>[p.name,p.name]))}<label class="wide">Observação<input name="reason" placeholder="Compra realizada fora do fluxo de solicitação"></label></div><p class="sub">Na próxima tela serão conferidos nota, filial e conversão de embalagem. O estoque só muda na confirmação final.</p></form>`,btn('Voltar','close')+btn('Continuar para conferência','entry-create','','primary'));}

function logTime(timestamp){return timestamp?new Date(timestamp).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Não registrado';}
function stayTime(o){if(o.type!=='mesa')return '—';if(!o.closingRequested)return 'Não registrado';const seconds=Math.max(0,Math.floor((o.closingRequested-o.created)/1000)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60);return (hours?hours+'h ':'')+minutes+'min '+seconds%60+'s';}

function updateCashMove(){const f=$('#cash-move-form');if(!f)return;const out=$('#cash-move-form [name=type]').value==='out',field=$('#cash-move-form [name=amount]'),available=Math.max(0,cashBalance()),amount=D.cents(field.value||0);field.max=out?String(available/100):'';$('#cash-move-preview').textContent=out?'Limite da retirada: '+money(available)+' • saldo após sangria: '+money(available-amount):'Saldo após suprimento: '+money(available+amount);}
</script></body></html>
